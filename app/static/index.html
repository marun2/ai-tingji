<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI听记</title>
<link rel="stylesheet" href="static/style.css?v=__V__">
</head>
<body>
<div class="app-shell">
  <aside class="side">
    <div class="logo-row">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 18 18" role="img" aria-label="AI听记"><rect x="2" y="7" width="2" height="4" rx="1" fill="#8e8e93"/><rect x="6" y="4" width="2" height="10" rx="1" fill="#55555a"/><rect x="10" y="2" width="2" height="14" rx="1" fill="#3a3a3c"/><rect x="14" y="6" width="2" height="6" rx="1" fill="#8e8e93"/></svg></div>
      <div class="brand-text"><div class="brand-name">AI听记</div><div class="brand-sub" id="brandSub">均瑶健康 · 会议中枢</div></div>
    </div>
    <form class="search" id="searchForm" autocomplete="off" role="search">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" placeholder="搜索会议" aria-label="搜索会议">
      <kbd>⌘K</kbd>
    </form>
    <nav class="nav" aria-label="主导航">
      <div class="nav-h">看结论</div>
      <button data-view="insight"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.2l7.5.6M7.2 8.2l3.7 7.6M16.8 10.2l-3.6 5.7"/></svg><span>洞察</span></button>
      <button data-view="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"/></svg><span>周报月报</span></button>
      <div class="nav-h">找内容</div>
      <button data-view="ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5a2 2 0 0 1-2 2H8l-4 3.5V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg><span>提问</span></button>
      <button data-view="kb" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>会议档案</span></button>
      <div class="nav-h" id="navAdminH" hidden>设置</div>
      <button data-view="admin" id="navAdmin" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>管理</span></button>
    </nav>
    <div class="side-fill">
      <div class="sf-box" id="sfStatus"></div>
      <div class="sf-box" id="sfRecent" hidden></div>
    </div>
    <div class="me" id="me"></div>
  </aside>
  <main id="app" class="panel"></main>
</div>
<div id="toast"></div>
<div id="modal" hidden></div>
<script src="static/app.js?v=__V__"></script>
</body>
</html>
